name: Merge gate drift

# Fails when the live `main` ruleset no longer enforces .github/required-checks.json: a required check or the
# up-to-date rule changed in settings, or a committed change to the gate was never applied. Not run on pull
# requests, because a PR that adds a required job lands before the ruleset is updated to require it; the push to
# main that lands it is where the missing update first shows. The fix is printed by the check; it never changes the
# ruleset itself.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-gate-drift
  cancel-in-progress: true

jobs:
  ruleset-drift:
    name: ruleset drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tools

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19"

      - name: Compare the live ruleset with the committed gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/check-ruleset-drift.mjs
