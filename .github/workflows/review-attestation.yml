name: Review attestation

# Sets the `review attestation` commit status on a PR's head: success only when the newest attestation comment by an
# account with write access says `ready` for that exact head, or when the PR changes only documentation and plans.
# A push re-evaluates, so the new head never inherits an old review. The decision is tools/review-attestation.mjs;
# reviewers attest with tools/attest-review.mjs. See REVIEW.md, "Approval and merge".
#
# Trust boundary: these triggers run with a token that can write statuses, so nothing from the PR is executed or
# checked out. The checkout is the default branch's tools/ directory only, nothing is installed, and the event
# payload is read by the script from GITHUB_EVENT_PATH; no comment, title or branch text is interpolated into a
# command. Comments by accounts without write access, edited or not, are ignored by the decision.

on:
  pull_request_target:
    # `edited` covers a base-branch change, which changes the PR's file list.
    types: [opened, reopened, synchronize, edited]
  issue_comment:
    types: [created, edited, deleted]
  # Re-evaluates one PR, or every open PR when left empty (for example right after the status becomes required).
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to re-evaluate (empty evaluates every open PR)
        required: false
        default: ""

permissions: {}

# One evaluation per PR at a time, never cancelled midway: a queued run replaces an older queued one and re-reads
# everything, so the last status written always reflects the latest event.
concurrency:
  group: >-
    review-attestation-${{ github.event.pull_request.number || github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: evaluate review attestation
    # Only comments on PRs that carry, or carried before an edit, an attestation marker.
    if: >-
      github.event_name != 'issue_comment' || (github.event.issue.pull_request && (
      contains(github.event.comment.body, 'clarkcant-review-attestation') ||
      contains(github.event.changes.body.from, 'clarkcant-review-attestation')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The default branch's tools, never the PR head's.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19"

      - name: Evaluate and set the status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTESTATION_PR: ${{ inputs.pull_request }}
        run: node tools/evaluate-review-attestation.mjs
