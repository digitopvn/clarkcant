name: Release

# Plans the next ClarkCant release and checks that the planned build holds together. It publishes nothing.
#
# The release contract is in docs/releases.md: Conventional Commits decide the version (tools/release/release-config.mjs),
# `main` releases stable versions and `dev` releases `-beta.N` prereleases, and every build embeds the release history it
# belongs to (apps/runtime/release-notes.json, checked by packages/contracts/src/release-notes.ts).
#
# What runs today:
#   - plan: semantic-release in dry-run mode against this checkout, with only the commit analyzer and the notes
#     generator loaded (tools/release/plan.mjs). Outputs the version, tag, channel, previous version and commit range,
#     and uploads plan.json and notes.md. A push that releases nothing (docs, tests, chores, CI) is a successful no-op.
#   - quality gate: when the plan releases something, stamps the planned version and history into this checkout's
#     manifests and release record (never committed back) and runs the repository's full verification on it.
#
# What does not exist yet, deliberately, so this workflow cannot tag, sign or publish anything:
#   - per-OS packaging (Windows, macOS, Linux/Omarchy), decided by docs/research/adr-004-desktop-packaging.md;
#   - signing and notarization (docs/release-signing.md lists the credentials and the TEST-before-PROD order);
#   - creating the tag and the GitHub release, and the update feeds an update service would read.
# No job here has write permission, an environment, or a secret. Adding any of those stages is a reviewed change to
# this file, gated by a protected environment.
#
# Not run on pull requests: the merge gate (.github/required-checks.json, enforced against ci.yml) is unchanged. It
# needs the `v0.2.1` baseline tag (docs/releases.md, "Before the first release"); without it the plan job fails and
# says so rather than planning 1.0.0.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      previous-version: ${{ steps.plan.outputs.previous-version }}
      range-from: ${{ steps.plan.outputs.range-from }}
      range-to: ${{ steps.plan.outputs.range-to }}
    steps:
      # Full history and every tag: the plan reads the last release from the tags reachable from this commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      # The workspace for the contract schema the plan validates against, and the isolated release tooling.
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir tools/release install --frozen-lockfile

      - name: Release tooling tests
        run: pnpm --dir tools/release test

      # semantic-release lists the release branches of the repository it plans; here that is this checkout, which
      # holds only the branch that was checked out. Every release branch that exists on origin is made local, so
      # `dev` sees `main` and a prerelease is planned against the stable line.
      - name: Make the release branches local
        run: |
          current="$(git branch --show-current)"
          for branch in main dev; do
            if [ "$branch" != "$current" ] && git rev-parse --verify --quiet "refs/remotes/origin/$branch" >/dev/null; then
              git branch --force "$branch" "refs/remotes/origin/$branch"
            fi
          done

      - name: Plan
        id: plan
        run: node tools/release/plan.mjs --out release-plan

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan
          path: release-plan/
          if-no-files-found: error
          retention-days: 30

  quality-gate:
    name: quality gate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-plan
          path: release-plan

      # The build a release would ship: one version everywhere, and the history it embeds. Checked, then verified.
      - name: Stamp ${{ needs.plan.outputs.tag }} into this checkout
        run: node tools/release/stamp.mjs release-plan/plan.json

      - name: Install the browser the driver tests launch
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm run verify
