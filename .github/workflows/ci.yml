name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The runtime executes TypeScript directly, so the floor matters.
        node: ["22.19", "24"]
        os: [ubuntu-latest]
        include:
          # The first desktop target is macOS, whose temporary directory sits behind a
          # symlink: path-canonicalisation tests that pass on Linux can fail there.
          - os: macos-latest
            node: "24"
          # Windows puts os.tmpdir() under <drive>:\Users\<user>, which redaction treats as a private
          # home path, and reports paths with `\`: both have broken tests that pass elsewhere.
          - os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The token is needed to fetch, not to persist; leaving it in
          # .git/config
          # makes it readable by every later step and by any script they run.
          persist-credentials: false
          # Both sides of push/PR diffs must be available. A missing base still
          # runs all checks.
          fetch-depth: 0

      - name: Classify the changed paths
        id: scope
        continue-on-error: true
        env:
          CI_DIFF_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DIFF_HEAD: HEAD
        run: node tools/ci-test-scope.mjs

      - name: Enable corepack
        if: >-
          steps.scope.outcome != 'success' || steps.scope.outputs.full !=
          'false'
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: >-
          steps.scope.outcome != 'success' || steps.scope.outputs.full !=
          'false'
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Keep document hashes, traceability and credential checks even on
      # prose-only changes.
      - name: Repository invariants
        run: node tools/check-invariants.mjs

      # --frozen-lockfile so CI verifies the committed resolution rather than
      # re-resolving it. The supply-chain policy in pnpm-workspace.yaml is
      # applied
      # during the same step.
      - name: Install
        if: >-
          steps.scope.outcome != 'success' || steps.scope.outputs.full !=
          'false'
        run: pnpm install --frozen-lockfile

      # The vector index needs a loadable extension, and whether it loads is a
      # property of the
      # platform rather than of the code: this repository is developed on darwin
      # arm64 and this job
      # runs on linux x64. Absent is a supported state and exits 0 with a
      # reason; installed but
      # unusable exits 1, which is the failure that would otherwise hide behind
      # a lexical fallback.
      - name: Probe the optional vector extension
        if: >-
          steps.scope.outcome != 'success' || steps.scope.outputs.full !=
          'false'
        run: node tools/probe-vector-extension.mjs

      - name: Typecheck
        if: >-
          steps.scope.outcome != 'success' || steps.scope.outputs.full !=
          'false'
        run: pnpm run typecheck

      - name: Lint
        if: >-
          steps.scope.outcome != 'success' || steps.scope.outputs.full !=
          'false'
        run: pnpm run lint

      # The browser driver tests launch a real Chromium. Without this step they
      # fail with a
      # message telling you to install it — a true and clear failure, but not a
      # test that ran.
      - name: Install the browser the driver tests launch
        if: >-
          steps.scope.outcome != 'success' || steps.scope.outputs.full !=
          'false'
        run: pnpm exec playwright install --with-deps chromium

      # The tests create and remove thousands of SQLite databases, profiles and
      # scratch trees under os.tmpdir(). On the Windows runner that is the C:
      # drive, which measured 10 to 30 times slower than D: (a SQLite open,
      # schema, 50 inserts and close: 430-1160ms median on C:, about 50ms on D:;
      # a 4KB write with fsync: 4-9ms on C:, 0.3ms on D:). The suite took about
      # 240s with C: and 130-140s with D:, and under that load tests that take
      # under a second elsewhere ran past the 20s timeout. The directory keeps
      # the <drive>:\Users\<user> shape this leg is here for, and its short
      # 8.3 form when the volume generates one, as the default RUNNER~1 path is.
      - name: Keep temporary files on the Windows runner's local disk
        if: >-
          runner.os == 'Windows' && (steps.scope.outcome != 'success' ||
          steps.scope.outputs.full != 'false')
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:RUNNER_TEMP
          $long = Join-Path $drive "Users\$env:USERNAME\AppData\Local\Temp"
          New-Item -ItemType Directory -Force $long | Out-Null
          $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($long).ShortPath
          "TEMP=$short" >> $env:GITHUB_ENV
          "TMP=$short" >> $env:GITHUB_ENV
          "Temporary files: $short (long form $long)"

      - name: Tests
        if: >-
          steps.scope.outcome != 'success' || steps.scope.outputs.full !=
          'false'
        run: pnpm run test

      # A blocked step is an honest outcome and exits zero; only a genuine
      # failure
      # fails this step. See the probe's own comment for the reasoning.
      - name: P0.1 Pi SDK lifecycle probe
        if: >-
          steps.scope.outcome != 'success' || steps.scope.outputs.full !=
          'false'
        run: node packages/pi-adapter/src/probe-cli.ts --json > probe.json

      - name: Upload probe evidence
        if: >-
          always() && (steps.scope.outcome != 'success' ||
          steps.scope.outputs.full != 'false')
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-sdk-probe-${{ matrix.os }}-node-${{ matrix.node }}
          path: probe.json
          if-no-files-found: warn

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so a leaked credential in an older commit is still
          # found.
          fetch-depth: 0
          # The token is needed to fetch, not to persist: leaving it in
          # .git/config
          # makes it readable by every later step and by any script they run.
          persist-credentials: false
      - name: Fail on credentials in current and historical file versions
        run: node tools/scan-secret-history.mjs

  # The browser suite was the only gate that exercises the five features of
  # issue #17 end to end, and until this
  # job existed it was run by hand on whichever machine happened to run it. That
  # is why the release report had to
  # say CI told nobody anything about it. It boots its own node and web server
  # on fixed ports, so it needs nothing
  # from this runner beyond the browser it launches.
  e2e:
    name: e2e (browser suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the browser the suite launches
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser suite
        run: pnpm test:e2e

      # A failure on the runner is otherwise known only by its message: the trace, screenshot and page snapshot of
      # each failed attempt are what show what the page was doing when it failed.
      - name: Keep what a failed browser test saw
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  reference-theme-browser:
    name: reference theme browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium

      - name: Reference theme browser journeys
        run: >-
          pnpm test:e2e apps/web/e2e/reference-theme-composition.spec.ts
          apps/web/e2e/widget-appearance.spec.ts

      - name: Keep reference theme visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-themes-${{ matrix.os }}
          path: |
            plans/reports/evidence/reference-themes/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # A package service runs in a container as the node's own user, which rootless Docker maps onto a subordinate id the
  # person does not own. The service-container suite is run here against a rootless daemon set up on the runner, so the
  # notes package's service really adds and lists a note in a folder the person owns, instead of that being assumed from
  # the command line. The rootful daemon is stopped first so the suite cannot quietly find it instead.
  service-rootless-docker:
    name: service container (rootless docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The runner's Docker comes without the rootless extras and its apt sources carry none, so Docker's own static
      # release is used, pinned by version and digest. Ubuntu 24.04 lets AppArmor refuse unprivileged user namespaces,
      # which a rootless daemon is made of, so that restriction is lifted for this job only.
      - name: Set up rootless Docker
        env:
          DOCKER_STATIC: https://download.docker.com/linux/static/stable/x86_64
          DOCKER_VERSION: 29.8.1
          DOCKER_SHA256: d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70
          ROOTLESS_EXTRAS_SHA256: 8f1ed16fc6913241e599af6234a7f30502bde6e73bebbbc7176b17802d967d49
        run: |
          sudo apt-get update
          sudo apt-get install -y uidmap slirp4netns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo systemctl disable --now docker.service docker.socket
          grep -q "^$(whoami):" /etc/subuid || echo "$(whoami):100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$(whoami):" /etc/subgid || echo "$(whoami):100000:65536" | sudo tee -a /etc/subgid

          cd "$RUNNER_TEMP"
          curl -fsSLO "$DOCKER_STATIC/docker-$DOCKER_VERSION.tgz"
          curl -fsSLO "$DOCKER_STATIC/docker-rootless-extras-$DOCKER_VERSION.tgz"
          echo "$DOCKER_SHA256  docker-$DOCKER_VERSION.tgz" | sha256sum -c -
          echo "$ROOTLESS_EXTRAS_SHA256  docker-rootless-extras-$DOCKER_VERSION.tgz" | sha256sum -c -
          bin="$RUNNER_TEMP/rootless-docker/bin"
          mkdir -p "$bin"
          tar -xzf "docker-$DOCKER_VERSION.tgz" --strip-components=1 -C "$bin"
          tar -xzf "docker-rootless-extras-$DOCKER_VERSION.tgz" --strip-components=1 -C "$bin"

          # The daemon puts each container in a systemd scope, which needs the person's own systemd session, as on
          # a desktop where they are logged in; lingering starts that session for the runner's user.
          sudo loginctl enable-linger "$(whoami)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers"

          export PATH="$bin:$PATH"
          nohup dockerd-rootless.sh > "$RUNNER_TEMP/dockerd-rootless.log" 2>&1 &
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          for _ in $(seq 60); do docker info > /dev/null 2>&1 && break; sleep 1; done
          docker info --format '{{json .SecurityOptions}}'

          echo "$bin" >> "$GITHUB_PATH"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"

      - name: Service container suite on rootless Docker
        env:
          CC_EXPECT_ROOTLESS_DOCKER: "1"
        run: pnpm exec vitest run apps/runtime/test/service-container-engine.spec.ts apps/runtime/test/service-container.spec.ts

      - name: The rootless daemon's log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/dockerd-rootless.log" || true

  # The desktop shell's own behaviour - the bounds it reports, the floor it
  # enforces, whether it is always on top -
  # can only be read back from a real window. Electron needs a display and a set
  # of shared libraries a bare runner
  # does not carry, so the display is virtual and named here rather than left as
  # an operator's manual step.
  desktop-smoke:
    name: desktop smoke (xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ubuntu 24.04 renamed the ALSA package, and this runner image has moved
      # between the two, so both names are
      # tried rather than pinning to whichever one this image happens to carry
      # today.
      - name: Install a virtual display and the libraries Electron loads
        run: |
          sudo apt-get update
          common="xvfb libgtk-3-0 libnss3 libgbm1"
          sudo apt-get install -y $common libasound2t64 || \
            sudo apt-get install -y $common libasound2

      # The SUID sandbox helper cannot be configured the way Electron asks for
      # on a GitHub runner, and Electron
      # aborts rather than run unsandboxed: "The SUID sandbox helper binary was
      # found, but is not configured
      # correctly". This job opens one window to read its bounds back, so the
      # sandbox is disabled here and the reason
      # is written down; the alternative is chowning a binary inside
      # node_modules to root, which no test should need.
      - name: Desktop smoke
        run: >-
          xvfb-run -a env ELECTRON_DISABLE_SANDBOX=1 pnpm --filter
          @clarkcant/app-desktop run smoke
