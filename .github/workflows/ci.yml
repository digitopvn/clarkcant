name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The runtime executes TypeScript directly, so the floor matters.
        node: ["22.19", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The token is needed to fetch, not to persist; leaving it in .git/config
          # makes it readable by every later step and by any script they run.
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile so CI verifies the committed resolution rather than
      # re-resolving it. The supply-chain policy in pnpm-workspace.yaml is applied
      # during the same step.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Repository invariants
        run: pnpm run invariants

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # The browser driver tests launch a real Chromium. Without this step they fail with a
      # message telling you to install it — a true and clear failure, but not a test that ran.
      - name: Install the browser the driver tests launch
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests
        run: pnpm run test

      # A blocked step is an honest outcome and exits zero; only a genuine failure
      # fails this step. See the probe's own comment for the reasoning.
      - name: P0.1 Pi SDK lifecycle probe
        run: node packages/pi-adapter/src/probe-cli.ts --json > probe.json

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-sdk-probe-node-${{ matrix.node }}
          path: probe.json
          if-no-files-found: warn

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so a leaked credential in an older commit is still found.
          fetch-depth: 0
          # The token is needed to fetch, not to persist: leaving it in .git/config
          # makes it readable by every later step and by any script they run.
          persist-credentials: false
      # The same patterns the repository invariant checker enforces locally.
      - name: Fail on credential-shaped strings
        run: |
          set -euo pipefail
          if git grep -nEI 'gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|npm_[A-Za-z0-9]{30,}' \
               -- . ':(exclude)docs/**' ':(exclude)pnpm-lock.yaml'; then
            echo "::error::a credential-shaped string was found in the tracked tree"
            exit 1
          fi
          echo "no credential-shaped strings found"
