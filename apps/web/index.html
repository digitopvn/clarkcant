<!doctype html>
<html lang="vi" data-cc-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClarkCant</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Before anything else, and after the CSP below in document order for readability only: the
      policy is a meta tag and applies to the whole document once parsed. A classic script in
      public/ rather than an inline one, because script-src is 'self'.
    -->
    <script src="/theme-init.js"></script>
    <!--
      The CSP is set here rather than left to defaults. `object-src 'none'` and `base-uri 'none'`
      remove two classic injection footholds, and no remote script may load.

      `connect-src` allows the node on any loopback port rather than one fixed port. A fixed
      port made the client's `gateway` parameter unusable: the client reads it, so pointing the
      app at a node on another port is a supported thing to do, but the policy refused every
      value except 8765 before the request left the page. The port is the operator's choice — it
      is their node — and loopback is already the trust boundary this application assumes.

      `img-src` allows `blob:` because that is how an imported image reaches the page. The bearer
      token cannot travel in an `<img src>`, so the bytes are fetched through the authenticated
      client and handed to the DOM as a blob URL; without `blob:` here every imported picture
      rendered as "could not be loaded" while the node was serving it correctly. `data:` stays for
      inline icons, and no remote origin is allowed — a picture from the node is the only picture.

      `media-src` allows `blob:` for the same reason and nothing else: the bytes behind a local video
      widget's reference are fetched with the bearer token through the same authenticated client and handed to `<video>` as an
      object URL this page created. Without it the directive fell back to `default-src 'self'` and
      Chromium rejected every local video ("Media load rejected by URL safety check"). No remote media
      origin is allowed and `data:` is not added: the only media a page can play is media its own code
      fetched from the node.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; frame-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
